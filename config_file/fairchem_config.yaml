trainer: equiformerv2_forces
experiment_name: test
dataset:
  train:
    format: oc22_lmdb_new #fairchem.core.datasets.oc22_lmdb_dataset.OC22LmdbDataset
    src: //volume/data/OC20/s2ef/2M/train/
    key_mapping:
      y: energy
      force: forces
    transforms:
      normalizer:
        energy:
          mean: 0.0
          stdev: 24.901469505465872
        forces:
          mean: 0.0
          stdev: 0.5111534595489502
      element_references:
        energy:
          file: ./config_file/coeff_2M.npz
    train_on_oc20_total_energies: True
    oc20_ref: None
  val:
    src: /volume/data/OC20/s2ef/all/val_id/

logger: wandb

outputs:
  energy:
    shape: 1
    level: system
  forces:
    irrep_dim: 1
    level: atom
    train_on_free_atoms: True
    eval_on_free_atoms: True

loss_functions:
  - energy:
      fn: mae
      coefficient: 2
  - forces:
      fn: l2mae
      coefficient: 100

evaluation_metrics:
  metrics:
    energy:
      - mae
    forces:
      - mae
      - cosine_similarity
      - magnitude_error
    misc:
      - energy_forces_within_threshold
  primary_metric: forces_mae


model:
  name: hydra_new
  pass_through_head_outputs: True
  otf_graph: True


  backbone:
    model: molfm.models.e2former.E2Former_wrapper.E2FormerBackbone
    encoder: "default" # or dit

    # dit_config
    encoder_embed_dim: 1024
    ffn_embedding_dim: 1536
    num_attention_heads: 32
    dropout: 0.1
    num_encoder_layers: 12


    # global_cfg:
    regress_forces: true
    direct_force: false
    use_padding: true
    use_fp16_backbone: false
    use_compile: false
    # hidden_size: 384
    # batch_size: 12
    # activation: gelu




    #  # molecular_graph_cfg:
    #   use_pbc: true
    #   use_pbc_single: false
    #   otf_graph: true
    #   max_num_elements: 90
    #   enforce_max_neighbors_strictly: false
    #   distance_function: gaussian

    # # gnn_cfg:
    #   atom_embedding_size: 128
    #   node_direction_embedding_size: 64
    #   node_direction_expansion_size: 64
    #   edge_distance_expansion_size: 128
    #   edge_distance_embedding_size: 64
    #   atten_name: flash
    #   atten_num_heads: 4
    #   readout_hidden_layer_multiplier: 2
    #   output_hidden_layer_multiplier: 2
    #   ffn_hidden_layer_multiplier: 4
    #   use_angle_embedding: true

    #   # reg_cfg:
    #   normalization: layernorm

    pbc_expanded_token_cutoff: 256
    pbc_expanded_num_cell_per_direction: 4




    # backbone_config:
    max_neighbors: 20
    irreps_node_embedding: "128x0e+128x1e+128x2e"
    num_layers: 8
    # max_neighbors: 20
    pbc_max_radius: 12.0
    max_radius: 15.0
    basis_type: "gaussian"
    number_of_basis: 128
    num_attn_heads: 4
    attn_scalar_head: 32
    irreps_head: "32x0e+32x1e+32x2e"
    rescale_degree: False
    nonlinear_message: False
    norm_layer: "rms_norm_sh_BL"
    alpha_drop: 0.1
    proj_drop: 0.0
    out_drop: 0.0
    drop_path_rate: 0.0
    attn_type: "first-order"
    tp_type : 'QK_alpha'
    edge_embedtype: "eqv2"
    attn_biastype: "share"
    ffn_type: 'default'
    add_rope: False
    time_embed: False
    force_head: null

  # heads:
  #   forces:
  #   energy:


optim:
  batch_size: 12
  eval_batch_size: 12
  load_balancing: atoms
  num_workers: 0
  lr_initial: 0.0001
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_factor: 0.2
    warmup_epochs: 0.1
    lr_min_factor: 0.5
  max_epochs: 30
  clip_grad_norm: 100
  ema_decay: 0.999
  eval_every: 30000

slurm:
  constraint: "volta32gb"