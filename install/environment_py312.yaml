# Pinned to the environment UBio-MolFM V1 was developed and tested on:
# Python 3.12 + PyTorch 2.8.0 / CUDA 12.8. The PyG extension wheels and
# faiss-gpu are CUDA-build specific, so the torch and CUDA versions have to
# move together with them.
name: mfm
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - loguru
  - numba
  - peft
  - python-lmdb
  - tensorboard
  - lmdb
  - orjson
  - submitit
  - numpy
  - scipy
  - pip:
      # PyTorch 2.8.0 + CUDA 12.8
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
      # PyG + extension wheels built against torch 2.8.0 / cu128
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
      - torch-geometric==2.7.0
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      # # others
      - deepspeed

      - triton
      - hydra-core
      - e3nn
      - ase
      - ase_db_backends
      - rdkit
      - wandb==0.21.0
      - nequip-allegro==0.7.0
      # - fairchem-core --no-deps
      - pymatgen
      # Neighbour search on GPU (backbone use_faiss=True, the default).
      - faiss-gpu==1.14.3
      # Simulation stack (molfm.interface.ase): HDF5 trajectories, the Fire-based
      # CLI, and .pdb/.gro structure reading.
      - h5py
      - fire
      - MDAnalysis
