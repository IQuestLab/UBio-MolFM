# Pinned to the environment UBio-MolFM V1 was developed and tested on:
# Python 3.12 + PyTorch 2.8.0 / CUDA 12.8. The PyG extension wheels and
# faiss-gpu are CUDA-build specific, so the torch and CUDA versions have to
# move together with them.
name: mfm
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - loguru
  - numba
  - peft
  - python-lmdb
  - tensorboard
  - lmdb
  - orjson
  - submitit
  - numpy
  - scipy
  - pip:
      # PyTorch 2.8.0 + CUDA 12.8
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
      # PyG + extension wheels built against torch 2.8.0 / cu128
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
      - torch-geometric==2.7.0
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      # # others
      - deepspeed

      - triton
      - hydra-core
      - e3nn
      - ase
      - ase_db_backends
      - rdkit
      - wandb==0.21.0
      - aim==3.29.1
      - tqdm==4.67.3
      - nequip-allegro==0.7.0
      # fairchem-core: required by the s2 / spectral mixed-resolution FFN
      # (molfm.models.e2former.uma_utils). Not listed here because its torch
      # pin conflicts with the pinned torch; install it after the env is
      # created:
      #   pip install --no-deps fairchem-core==2.4.0
      # Only its `uma.nn` activation/SO3 layers are used.
      - pymatgen
      # Neighbour search on GPU (backbone use_faiss=True, the default).
      - faiss-gpu==1.14.3
      # Simulation stack (molfm.interface.ase): HDF5 trajectories, the Fire-based
      # CLI, and .pdb/.gro structure reading.
      - h5py
      - fire
      - MDAnalysis
      # Experiment tracking used by the training entry point (optional at
      # inference time: the ASE runner falls back to no tracking if absent).
      - swanlab
      # KMeans node clustering in the mixed-resolution backbone's cluster path.
      - scikit-learn
